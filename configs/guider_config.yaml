_partial_: true
_target_: nemo.collections.llm.api.finetune
data:
  _target_: nemo.collections.llm.gpt.data.pre_training.PreTrainingDataModule
  paths:
    train:
      - ./data/megatron_shuffled_int16
    validation:
      - ./data/megatron_shuffled_int16
  global_batch_size: 8
  micro_batch_size: 1
  seq_length: 4096
  tokenizer:
    _target_: nemo.collections.nlp.modules.common.tokenizer_utils.get_nmt_tokenizer
    library: huggingface
    model_name: google-bert/bert-base-uncased
    tokenizer_model: null
    use_fast: true
  num_workers: 8
log:
  _target_: nemo.lightning.nemo_logger.NeMoLogger
  ckpt:
    _target_: nemo.lightning.pytorch.callbacks.model_checkpoint.ModelCheckpoint
    filename: '{model_name}--{val_loss:.2f}-{step}-{consumed_samples}'
    save_last: true
    save_top_k: 10
    train_time_interval:
      _target_: datetime.timedelta
      minutes: 15
  log_dir: null
  name: default
  tensorboard:
    _target_: lightning.pytorch.loggers.tensorboard.TensorBoardLogger
    name: default
    save_dir: tb_logs
  wandb: null
model:
  _target_: nemo.collections.llm.gpt.model.base.GPTModel
  config:
    _target_: nemo.collections.llm.gpt.model.ssm.BaseMambaConfig130M
  tokenizer:
    _target_: nemo.collections.nlp.modules.common.tokenizer_utils.get_nmt_tokenizer
    library: huggingface
    model_name: EleutherAI/gpt-neox-20b
    tokenizer_model: null
    use_fast: true
optim:
  _target_: nemo.lightning.pytorch.optim.megatron.MegatronOptimizerModule
  config:
    _target_: megatron.core.optimizer.optimizer_config.OptimizerConfig
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    bf16: true
    clip_grad: 1.0
    fp16: false
    lr: 5.0e-06
    optimizer: adam
    use_distributed_optimizer: true
    weight_decay: 0.1
  lr_scheduler:
    _target_: nemo.lightning.pytorch.optim.lr_scheduler.CosineAnnealingScheduler
    constant_steps: 0
    min_lr: 0
    warmup_steps: 50
resume:
  _target_: nemo.lightning.resume.AutoResume
  restore_config:
    _target_: nemo.lightning.pytorch.strategies.utils.RestoreConfig
    path: null
trainer:
  _target_: nemo.lightning.pytorch.trainer.Trainer
  accelerator: gpu
  accumulate_grad_batches: 1
  callbacks:
  - _target_: nemo.lightning.pytorch.callbacks.model_checkpoint.ModelCheckpoint
    dirpath: null
    every_n_train_steps: 10
  devices: 8
  limit_test_batches: 50
  limit_val_batches: 32
  log_every_n_steps: 10
  max_steps: 100
  num_nodes: 1
  plugins:
    _target_: nemo.lightning.pytorch.plugins.mixed_precision.MegatronMixedPrecision
    params_dtype:
      _call_: false
      _target_: torch.bfloat16
    precision: bf16-mixed
    # FP8 settings
    fp8: e4m3                          # Enable FP8: "e4m3" or "hybrid", set to 4 exponent bits and 3 mantissa bits.
    fp8_margin: 0
    fp8_amax_history_len: 1024      
    fp8_amax_compute_algo: max         # "max" or "most_recent"
    fp8_wgrad: true                    # Store Weight gradients in FP8
    fp8_dot_product_attention: false   # No need, we are not working with attention
    fp8_multi_head_attention: false    # Again, no need, we dont use attention
    fp8_params: false                  # Store parameters in FP8
  strategy:
    _target_: nemo.lightning.pytorch.strategies.megatron_strategy.MegatronStrategy
    ckpt_async_save: false
    ckpt_load_optimizer: false
    ckpt_save_optimizer: false
    gradient_as_bucket_view: true
    pipeline_model_parallel_size: 1
    tensor_model_parallel_size: 1
  use_distributed_sampler: false
  val_check_interval: 100
